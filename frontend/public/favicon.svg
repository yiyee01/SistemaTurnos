<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Cuerpo del calendario -->
  <rect x="5" y="9" width="22" height="17" rx="3" fill="white" fill-opacity="0.15"/>
  <rect x="5" y="9" width="22" height="17" rx="3" stroke="white" stroke-width="1.5" stroke-opacity="0.9"/>

  <!-- Cabecera del calendario (franja superior) -->
  <rect x="5" y="9" width="22" height="6" rx="3" fill="white" fill-opacity="0.25"/>
  <rect x="5" y="12" width="22" height="3" fill="white" fill-opacity="0.25"/>

  <!-- Argollas del calendario -->
  <rect x="10" y="6" width="2.5" height="5" rx="1.25" fill="white" fill-opacity="0.9"/>
  <rect x="19.5" y="6" width="2.5" height="5" rx="1.25" fill="white" fill-opacity="0.9"/>

  <!-- Cruz médica (centrada en la parte baja del calendario) -->
  <rect x="14.5" y="18" width="3" height="7" rx="1" fill="white"/>
  <rect x="11.5" y="20.5" width="9" height="2" rx="1" fill="white"/>
</svg>